# IB-DTA -- regression (pKd) configuration
# Base architecture: DrugBAN (Bai et al., Nat Mach Intell 2023)

DATA_ROOT: "./datasets"

ENCODER:
  BACKEND: builtin        # builtin (no dgl) | dgl (DrugBAN's original)

DRUG:
  NODE_IN_FEATS: 75
  NODE_IN_EMBEDDING: 128
  HIDDEN_LAYERS: [128, 128, 128]
  PADDING: true
  MAX_NODES: 290
  DROPOUT: 0.0

PROTEIN:
  EMBEDDING_DIM: 128
  NUM_FILTERS: [128, 128, 128]
  KERNEL_SIZE: [3, 6, 9]
  PADDING: true
  MAX_LEN: 1200

# The interaction bottleneck -- the part that differs from DrugBAN.
IB:
  H_DIM: 128
  HEADS: 1                # more heads = larger support = weaker bottleneck
  SELECTION: entmax       # entmax | topk | softmax (dense ablation)
  BUDGET_K: 32            # pairs per head when SELECTION=topk
  ADAPTIVE_BUDGET: true   # concave penalty -> per-complex support size
  DROPOUT: 0.1
  CHUNK_Q: 64             # residues per chunk in the pair decoder; 0 = no chunking
                          # keeps peak memory bounded on long proteins
  CHECKPOINT_CHUNKS: true # recompute each chunk in backward instead of
                          # storing it. Without this, chunking bounds
                          # INFERENCE memory only: autograd keeps every
                          # chunk alive and training peak returns to the
                          # unchunked total. Costs one extra forward over
                          # the pair MLP. Set false only if memory is ample.

TASK:
  NAME: regression

LOSS:
  LAMBDA_RANK: 0.1        # pairwise ranking term (screening cares about order)
  LAMBDA_SPARSE: 0.001    # weight on the concave sparsity penalty

SOLVER:
  MAX_EPOCH: 50
  PATIENCE: 12            # stop when validation has not improved for this
                          # many epochs. The reported result is the best
                          # checkpoint either way, so this saves time without
                          # changing the answer. 0 = always run MAX_EPOCH.
  BATCH_SIZE: 32
  NUM_WORKERS: 0
  LR: 0.0005
  WEIGHT_DECAY: 0.0001
  SEED: 2048

RESULT:
  OUTPUT_DIR: "./result"
  SAVE_MODEL: true
